<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四季小屋 · Four Seasons Cottage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<style>
  :root{
    --cream:#f5eddc;
    --cream-dim:rgba(245,237,220,.72);
    --glass:rgba(26,19,14,.55);
    --glass-line:rgba(245,237,220,.22);
    --accent:#e8964f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f17}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--cream);
    -webkit-user-select:none;user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #scene.dragging{cursor:grabbing}
  #scene.pick{cursor:pointer}

  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(5,8,14,.38) 100%);}
  .top-shade{position:fixed;top:0;left:0;right:0;height:110px;pointer-events:none;z-index:2;
    background:linear-gradient(to bottom,rgba(5,8,14,.35),transparent);}

  .titleblock{position:fixed;top:22px;left:26px;z-index:5;pointer-events:none;opacity:0;transform:translateY(-8px);
    transition:opacity 1.2s ease .3s,transform 1.2s ease .3s;}
  .titleblock.in{opacity:1;transform:none}
  .titleblock .eyebrow{font-size:10px;letter-spacing:.42em;color:var(--accent);font-weight:600;text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .titleblock h1{
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    font-size:34px;font-weight:700;letter-spacing:.18em;line-height:1.25;margin-top:6px;
    text-shadow:0 2px 14px rgba(0,0,0,.55);}
  .titleblock .sub{font-size:12px;letter-spacing:.14em;color:var(--cream-dim);margin-top:6px;
    text-shadow:0 1px 6px rgba(0,0,0,.6)}

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-line);
    backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .switch-dock{position:fixed;right:22px;bottom:22px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .dots{display:flex;gap:6px;padding:8px 12px;border-radius:999px;opacity:0;transition:opacity 1s ease 1s}
  .dots.in{opacity:1}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(245,237,220,.28);transition:all .4s}
  .dots i.on{background:var(--accent);transform:scale(1.45);box-shadow:0 0 8px rgba(232,150,79,.8)}
  #switchBtn{
    display:flex;align-items:center;gap:10px;padding:13px 20px 13px 16px;border-radius:999px;
    color:var(--cream);font-size:15px;letter-spacing:.1em;font-family:inherit;cursor:pointer;
    opacity:0;transform:translateY(10px);}
  #switchBtn.in{opacity:1;transform:none;transition:opacity .8s ease .6s,transform .8s ease .6s}
  #switchBtn.ready{transition:transform .18s ease,box-shadow .3s ease,border-color .3s}
  #switchBtn:hover{transform:translateY(-2px) scale(1.03);border-color:rgba(232,150,79,.65)}
  #switchBtn:active{transform:scale(.96)}
  #switchBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #switchBtn .emoji{font-size:20px;line-height:1}
  #switchBtn .divider{width:1px;height:16px;background:var(--glass-line)}
  #switchBtn .next-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cream-dim)}
  #switchBtn .next-hint svg{width:13px;height:13px}

  #soundBtn{position:fixed;top:22px;right:22px;z-index:6;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--cream);
    opacity:0;}
  #soundBtn.in{opacity:1;transition:opacity .8s ease .9s,transform .18s}
  #soundBtn.ready{transition:transform .18s,border-color .3s}
  #soundBtn:hover{transform:scale(1.1)}
  #soundBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  #hint{position:fixed;left:26px;bottom:22px;z-index:5;pointer-events:none;font-size:12px;line-height:2;
    color:var(--cream-dim);letter-spacing:.08em;text-shadow:0 1px 6px rgba(0,0,0,.7);
    opacity:0;transition:opacity 1s ease 1.4s}
  #hint.in{opacity:1}
  #hint b{color:var(--cream);font-weight:600}
  #hint .k{display:inline-block;padding:1px 7px;border:1px solid var(--glass-line);border-radius:6px;
    font-size:11px;background:rgba(26,19,14,.45)}

  #toast{position:fixed;left:50%;bottom:96px;z-index:7;transform:translate(-50%,14px);
    padding:10px 22px;border-radius:999px;font-size:14px;letter-spacing:.12em;
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #loader{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#101724,#0a0e16 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .9s ease; }
  #loader.hide{opacity:0;pointer-events:none}
  #loader .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(245,237,220,.15);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  #loader p{font-size:13px;letter-spacing:.35em;color:var(--cream-dim);text-indent:.35em}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    .titleblock h1{font-size:24px}
    .titleblock{top:16px;left:18px}
    #hint{display:none}
    .switch-dock{right:14px;bottom:14px}
    #switchBtn{padding:11px 16px 11px 13px;font-size:13px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="top-shade"></div>

<header class="titleblock" id="titleblock">
  <div class="eyebrow">Four Seasons Cottage</div>
  <h1>四季小屋</h1>
  <div class="sub">一间会随季节与昼夜流转的乡居</div>
</header>

<button id="soundBtn" class="glass" title="声音开关" aria-label="声音开关">🔇</button>

<div id="hint">
  <b>拖动</b> 旋转视角 · <b>滚轮</b> 缩放<br>
  点击 <b>窗帘 · 海报 · 椅子 · 书本 · 笔</b> 互动<br>
  按<span class="k">任意键</span>或右下按钮，翻到下一页
</div>

<div class="switch-dock">
  <div class="dots glass" id="dots"></div>
  <button id="switchBtn" class="glass" aria-label="切换季节与昼夜">
    <span class="emoji" id="btnEmoji">🌻</span>
    <span id="btnLabel">夏 · 白天</span>
    <span class="divider"></span>
    <span class="next-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      下一页
    </span>
  </button>
</div>

<div id="toast" class="glass"></div>

<div id="loader">
  <div class="ring"></div>
  <p>正在搭建四季小屋</p>
</div>

<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"><\/script>');</script>
<script>
(function(){
'use strict';

/* ============================================================
   §0 小工具
============================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

/* 迷你补间系统 */
const tweens=[];
function tween(opt){
  const tw={t0:performance.now(),dur:opt.dur||600,ease:opt.ease||easeInOutCubic,
    update:opt.update,done:opt.done,owner:opt.owner||null,dead:false};
  tweens.push(tw);return tw;
}
function killTweens(owner){for(const t of tweens)if(t.owner===owner)t.dead=true;}
function stepTweens(){
  const now=performance.now();
  for(let i=tweens.length-1;i>=0;i--){
    const t=tweens[i];
    if(t.dead){tweens.splice(i,1);continue;}
    const k=clamp((now-t.t0)/t.dur,0,1);
    t.update&&t.update(t.ease(k),k);
    if(k>=1){tweens.splice(i,1);t.done&&t.done();}
  }
}

/* ============================================================
   §1 程序化音频（WebAudio 生成，无外部资源）
============================================================ */
const Audio={
  ctx:null,started:false,muted:false,
  master:null,music:null,windGain:null,windFilter:null,echo:null,
  season:'summer',night:false,
  nextBar:0,
  CHORDS:{
    summer:{bar:7.5,prog:[[60,64,67,71],[57,60,64,67],[53,57,60,65],[55,59,62,64]],pent:[60,62,64,67,69,72,74,76]},
    autumn:{bar:8.2,prog:[[57,60,64,71],[53,57,60,64],[52,55,60,64],[52,55,59,62]],pent:[57,60,62,64,67,69,72]},
    winter:{bar:9.5,prog:[[50,57,65,69],[46,53,57,62],[53,60,64,67],[52,55,60,64]],pent:[62,65,67,69,72,74]},
    spring:{bar:7.2,prog:[[55,59,62,66],[52,55,59,62],[48,55,59,62],[50,54,57,62]],pent:[62,64,67,69,71,74,76,79]},
  },
  midi:m=>440*Math.pow(2,(m-69)/12),
  init(){
    if(this.started)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      const c=this.ctx;
      const comp=c.createDynamicsCompressor();
      comp.threshold.value=-18;comp.ratio.value=5;comp.connect(c.destination);
      this.master=c.createGain();this.master.gain.value=.85;this.master.connect(comp);
      /* 音乐总线 + 回声 */
      this.music=c.createGain();this.music.gain.value=.5;this.music.connect(this.master);
      this.echo=c.createDelay(1.5);this.echo.delayTime.value=.42;
      const fb=c.createGain();fb.gain.value=.36;
      const fbF=c.createBiquadFilter();fbF.type='lowpass';fbF.frequency.value=1600;
      this.echo.connect(fb);fb.connect(fbF);fbF.connect(this.echo);
      const wet=c.createGain();wet.gain.value=.5;
      this.echo.connect(wet);wet.connect(this.music);
      /* 风声：循环噪声 + 带通 + 慢速 LFO */
      const len=2*c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=c.createBufferSource();src.buffer=buf;src.loop=true;
      this.windFilter=c.createBiquadFilter();this.windFilter.type='bandpass';
      this.windFilter.frequency.value=520;this.windFilter.Q.value=.65;
      this.windGain=c.createGain();this.windGain.gain.value=0;
      src.connect(this.windFilter);this.windFilter.connect(this.windGain);
      this.windGain.connect(this.master);src.start();
      const lfo=c.createOscillator(),lg=c.createGain();
      lfo.frequency.value=.13;lg.gain.value=190;
      lfo.connect(lg);lg.connect(this.windFilter.frequency);lfo.start();
      this.windGain.gain.setTargetAtTime(.013,c.currentTime,2); /* 常驻微风 */
      this.nextBar=c.currentTime+.15;
      setInterval(()=>this.tick(),300);
      this.started=true;
    }catch(e){console.warn('audio init failed',e);}
  },
  tick(){
    const c=this.ctx;if(!c)return;
    const ch=this.CHORDS[this.season];
    while(this.nextBar<c.currentTime+1.4){
      this.scheduleBar(this.nextBar,ch);
      this.nextBar+=ch.bar;
    }
    /* 夜虫与晨鸟 */
    if(this.night&&this.season!=='winter'&&Math.random()<.25)
      this.crickets(c.currentTime+rand(.1,1));
    else if(!this.night&&(this.season==='summer'||this.season==='spring')&&Math.random()<.16)
      this.birds(c.currentTime+rand(.1,1.2));
  },
  scheduleBar(t,ch){
    const c=this.ctx,bar=ch.bar;
    /* 铺底和声 */
    const chord=ch.prog[randi(0,ch.prog.length-1)];
    chord.forEach(m=>{
      const f=this.midi(m-(this.season==='winter'?12:0));
      const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
      o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f;o2.detune.value=5;
      lp.type='lowpass';lp.frequency.value=760;
      const v=this.night?.028:.04;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v,t+bar*.3);
      g.gain.setValueAtTime(v,t+bar*.62);
      g.gain.linearRampToValueAtTime(0,t+bar*1.05);
      o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(this.music);
      o1.start(t);o2.start(t);o1.stop(t+bar*1.1);o2.stop(t+bar*1.1);
    });
    /* 八音盒式散音 */
    let n=this.season==='winter'?randi(1,2):randi(2,4);
    if(this.night)n=Math.max(1,n-1);
    for(let i=0;i<n;i++){
      const tt=t+rand(.8,bar-1.2);
      const m=ch.pent[randi(0,ch.pent.length-1)];
      this.pluck(this.midi(m),tt,rand(-.45,.45),this.night?.05:.075);
    }
  },
  pluck(f,t,pan,vol){
    const c=this.ctx;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
    o.connect(g);
    if(c.createStereoPanner){
      const p=c.createStereoPanner();p.pan.value=pan||0;
      g.connect(p);p.connect(this.music);p.connect(this.echo);
    }else{g.connect(this.music);g.connect(this.echo);}
    o.start(t);o.stop(t+1.7);
  },
  blip(){ /* 交互反馈音 */
    if(!this.started||this.muted)return;
    const t=this.ctx.currentTime;
    this.pluck(880,t,0,.05);this.pluck(1318.5,t+.07,0,.03);
  },
  crickets(t){
    const c=this.ctx;
    for(let i=0;i<5;i++){
      const o=c.createOscillator(),g=c.createGain(),tt=t+i*.062;
      o.type='sine';o.frequency.value=rand(4100,4600);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.018,tt+.012);
      g.gain.linearRampToValueAtTime(0,tt+.045);
      o.connect(g);g.connect(this.master);o.start(tt);o.stop(tt+.06);
    }
  },
  birds(t){
    const c=this.ctx,n=randi(2,4);
    for(let i=0;i<n;i++){
      const o=c.createOscillator(),g=c.createGain(),tt=t+i*.16;
      o.type='sine';
      o.frequency.setValueAtTime(rand(2400,2900),tt);
      o.frequency.exponentialRampToValueAtTime(rand(3200,3800),tt+.09);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.02,tt+.02);
      g.gain.linearRampToValueAtTime(0,tt+.12);
      o.connect(g);g.connect(this.master);o.start(tt);o.stop(tt+.14);
    }
  },
  windSwell(dur){ /* 换季大风 */
    if(!this.started)return;
    const g=this.windGain.gain,t=this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(g.value,.013),t);
    g.linearRampToValueAtTime(.3,t+dur*.18);
    g.setValueAtTime(.3,t+dur*.5);
    g.linearRampToValueAtTime(.013,t+dur);
  },
  setSeason(s){this.season=s;},
  setNight(n){this.night=n;},
  toggleMute(){
    if(!this.started)return !this.muted;
    this.muted=!this.muted;
    this.master.gain.setTargetAtTime(this.muted?0:.85,this.ctx.currentTime,.1);
    return this.muted;
  }
};

/* ============================================================
   §2 程序化纹理
============================================================ */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ctex(c){const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}

function texFloor(){
  const c=makeCanvas(512,512),g=c.getContext('2d');
  const cols=['#b08350','#a97b48','#b78a56','#a37646'];
  for(let r=0;r<6;r++){
    g.fillStyle=cols[r%cols.length];
    g.fillRect(0,r*86,512,86);
    g.fillStyle='rgba(60,35,15,.55)';g.fillRect(0,r*86,512,3);
    g.strokeStyle='rgba(70,45,20,.18)';g.lineWidth=1.4;
    for(let i=0;i<5;i++){
      g.beginPath();const y=r*86+rand(12,74);
      g.moveTo(0,y);
      for(let x=0;x<=512;x+=64)g.lineTo(x,y+rand(-4,4));
      g.stroke();
    }
    g.fillStyle='rgba(60,35,15,.5)';
    g.fillRect(randi(0,512),r*86,3,86);
  }
  const t=ctex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.6,1.6);return t;
}
function texWall(){
  const c=makeCanvas(256,256),g=c.getContext('2d');
  g.fillStyle='#efe3c6';g.fillRect(0,0,256,256);
  for(let i=0;i<900;i++){
    g.fillStyle=`rgba(${randi(120,160)},${randi(95,125)},${randi(60,85)},${rand(.03,.1)})`;
    g.fillRect(rand(0,256),rand(0,256),rand(1,3),rand(1,3));
  }
  const t=ctex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1.4);return t;
}
function texBlanket(){
  const c=makeCanvas(256,256),g=c.getContext('2d');
  g.fillStyle='#c96f4a';g.fillRect(0,0,256,256);
  g.fillStyle='rgba(245,235,215,.32)';
  g.fillRect(0,52,256,26);g.fillRect(0,168,256,26);
  g.fillRect(52,0,26,256);g.fillRect(168,0,26,256);
  g.strokeStyle='rgba(90,40,25,.25)';g.lineWidth=2;
  for(let i=0;i<8;i++){g.beginPath();g.moveTo(0,i*36+rand(0,10));g.lineTo(256,i*36+rand(0,10));g.stroke();}
  return ctex(c);
}
function texPages(){
  const c=makeCanvas(128,128),g=c.getContext('2d');
  g.fillStyle='#f7f1df';g.fillRect(0,0,128,128);
  g.strokeStyle='rgba(90,80,60,.4)';g.lineWidth=1.6;
  for(let i=0;i<9;i++){g.beginPath();g.moveTo(16,20+i*11);g.lineTo(112,20+i*11);g.stroke();}
  return ctex(c);
}
const _posterCache={};
function texPoster(season){
  if(_posterCache[season])return _posterCache[season];
  const c=makeCanvas(256,320),g=c.getContext('2d');
  const P={
    summer:{bg:'#ffe9b0',ink:'#c96a1e'},
    autumn:{bg:'#f7e3c3',ink:'#a34e1a',leaf:'#d2622a'},
    winter:{bg:'#eaf2f9',ink:'#4a6f94'},
    spring:{bg:'#fdeef3',ink:'#c25a86',blossom:'#f2a8c4'},
  }[season];
  g.fillStyle=P.bg;g.fillRect(0,0,256,320);
  for(let i=0;i<400;i++){
    g.fillStyle=`rgba(120,90,50,${rand(.02,.06)})`;
    g.fillRect(rand(0,256),rand(0,320),rand(1,2.5),rand(1,2.5));
  }
  g.strokeStyle=P.ink;g.lineWidth=5;g.strokeRect(12,12,232,296);
  g.lineWidth=2;g.strokeRect(22,22,212,276);
  if(season==='summer'){
    g.fillStyle='#ff9d47';g.beginPath();g.arc(128,105,42,0,7);g.fill();
    g.strokeStyle='#ff9d47';g.lineWidth=6;
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
      g.beginPath();g.moveTo(128+Math.cos(a)*52,105+Math.sin(a)*52);
      g.lineTo(128+Math.cos(a)*66,105+Math.sin(a)*66);g.stroke();}
    g.fillStyle='#4aa8c9';g.fillRect(40,175,176,14);g.fillRect(52,197,152,10);
    g.fillStyle='rgba(255,255,255,.75)';
    g.beginPath();g.arc(88,60,16,0,7);g.arc(112,64,12,0,7);g.fill();
  }else if(season==='autumn'){
    g.fillStyle=P.leaf;
    g.save();g.translate(128,112);g.rotate(.25);
    g.beginPath();
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2,r=i%2?58:30;

};
function updateCamera(){
  orbit.yaw+=(orbit.tyaw-orbit.yaw)*.1;
  orbit.pitch+=(orbit.tpitch-orbit.pitch)*.1;
  orbit.dist+=(orbit.tdist-orbit.dist)*.08;
  const cp=Math.cos(orbit.pitch),sp=Math.sin(orbit.pitch);
  camera.position.set(
    orbit.target.x+orbit.dist*cp*Math.cos(orbit.yaw),
    orbit.target.y+orbit.dist*cp*Math.sin(orbit.yaw),
    orbit.target.z+orbit.dist*sp);
  camera.lookAt(orbit.target);
}

  const trunkH=small?1.7:2.6;

      br.geometry.rotateX(Math.PI/2);
      br.position.set(x+Math.sin(a)*len*.45,y+Math.cos(a)*len*.45,top+.15+len*.3);

      envGroup.add(cap);snowCaps.push(cap);

function mixPalette(out,A,B,t){
  for(const k in A){
    const va=A[k],vb=B[k];
    if(va&&va.isColor){
      if(!out[k]||!out[k].isColor)out[k]=new THREE.Color();
      out[k].copy(va).lerp(vb,t);
    }else if(va&&va.isVector3){
      if(!out[k]||!out[k].isVector3)out[k]=new THREE.Vector3();
      out[k].lerpVectors(va,vb,t);
    }else out[k]=lerp(va,vb,t);
  }
}

  pen.userData.stored=true;
  Audio.blip();
  const p0=pen.position.clone(),p1=new THREE.Vector3(.32,3.62,1.72);
  const ctrl=p0.clone().lerp(p1,.5);ctrl.z+=.4;
  const ry0=pen.rotation.y;
  tween({dur:750,ease:easeInOutCubic,owner:pen,
    update:k=>{
      const a=p0.clone().lerp(ctrl,k),b=ctrl.clone().lerp(p1,k);
      pen.position.copy(a.lerp(b,k));
      pen.scale.setScalar(1-k*.8);
      pen.rotation.y=ry0+k*2.5;
    },
    done:()=>{pen.visible=false;}});
  showToast('笔收进了笔筒 ✏️');
}
function storeBook(){
  if(bookStored)return;
  bookStored=true;
  Audio.blip();
  const p0=bookGroup.position.clone();
  const p1=new THREE.Vector3(.3,4.06,1.86);
  const ctrl=p0.clone().lerp(p1,.5);ctrl.z+=.55;
  const rz0=bookGroup.rotation.z;
  tween({dur:1100,ease:easeInOutCubic,owner:'book',
    update:k=>{
      const a=p0.clone().lerp(ctrl,k),b=ctrl.clone().lerp(p1,k);
      bookGroup.position.copy(a.lerp(b,k));
      pageL.rotation.y=lerp(.26,0,clamp(k*2.2,0,1));
      pageR.rotation.y=lerp(-.26,0,clamp(k*2.2,0,1));
      bookGroup.rotation.z=lerp(rz0,-.15,k);
      bookGroup.scale.setScalar(lerp(1,.55,clamp((k-.25)/.6,0,1)));
    },
    done:()=>{bookGroup.visible=false;}});
  showToast('书本放回了书架 📚');
}
function toggleCurtain(){
  Audio.blip();
  const open=curtainOpen<.5;
  setCurtain(open?1:0);
  showToast(open?(nightFactor>.5?'窗帘拉开，月光洒进来了 🌙':'窗帘拉开，阳光洒进来了 ☀️'):'窗帘拉上了');
}

/* 拾取 */
const raycaster=new THREE.Raycaster();
const pointerNDC=new THREE.Vector2();
const mouseXY={x:-1,y:-1};
let mouseDirty=false,hoverRoot=null,downPos=null,dragging=false,lastPX=0,lastPY=0;
function pickAt(cx,cy){
  pointerNDC.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  raycaster.setFromCamera(pointerNDC,camera);
  const hits=raycaster.intersectObjects(interactables,true);
  for(const h of hits){
    /* 整条父链可见才算命中（隐藏的书/笔不可点） */
    let vis=true;
    for(let n=h.object;n;n=n.parent){if(n.visible===false){vis=false;break;}}
    if(!vis)continue;
    let o=h.object;
    while(o&&!o.userData.interactive)o=o.parent;
    if(o)return o;
  }
  return null;
}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  downPos={x:e.clientX,y:e.clientY};
  lastPX=e.clientX;lastPY=e.clientY;
  dragging=false;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(downPos){
    const dx=e.clientX-lastPX,dy=e.clientY-lastPY;
    lastPX=e.clientX;lastPY=e.clientY;
    if(Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)dragging=true;
    if(dragging){
      canvas.classList.add('dragging');
      orbit.tyaw-=dx*.005;
      orbit.tpitch=clamp(orbit.tpitch+dy*.005,.15,1.45);
    }
  }
  mouseXY.x=e.clientX;mouseXY.y=e.clientY;mouseDirty=true;
});
canvas.addEventListener('pointerup',e=>{
  canvas.classList.remove('dragging');
  if(downPos&&!dragging){
    const hit=pickAt(e.clientX,e.clientY);
    if(hit&&!trans){
      const kind=hit.userData.interactive;
      if(kind==='curtain')toggleCurtain();
      else if(kind==='chair'){
        Audio.blip();setChair(CHAIR_STRAIGHT);showToast('椅子扶正了 🪑');
      }
      else if(kind==='book')storeBook();
      else if(kind==='poster'){
        const p=posters.find(pp=>pp.holder===hit);p&&straightenPoster(p);
      }
    }
  }
  downPos=null;dragging=false;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  orbit.tdist=clamp(orbit.tdist*(1+e.deltaY*.0011),7.5,20);
},{passive:false});
/* 触屏双指缩放 */
let pinch0=0,dist0=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    dist0=orbit.tdist;
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinch0){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    orbit.tdist=clamp(dist0*pinch0/d,7.5,20);
  }
},{passive:true});

/* ============================================================
   §11 状态机：昼夜渐变 / 换季旋转
============================================================ */
const btnEmoji=document.getElementById('btnEmoji');
const btnLabel=document.getElementById('btnLabel');
const dotsEl=document.getElementById('dots');
STATES.forEach(()=>{dotsEl.appendChild(document.createElement('i'));});
function updateButton(){
  const st=STATES[stateIdx];
  btnEmoji.textContent=SEASON_EMOJI[st.s];
  btnLabel.textContent=`${SEASON_CN[st.s]} · ${st.n?'夜晚':'白天'}`;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===stateIdx));
}
let lastSwitch=0;
function gotoNext(){
  const now=performance.now();
  if(trans||now-lastSwitch<300)return;
  lastSwitch=now;
  ensureAudio();
  stateIdx=(stateIdx+1)%STATES.length;
  const st=STATES[stateIdx];
  Audio.setSeason(st.s);Audio.setNight(st.n);
  updateButton();
  showToast(`${SEASON_EMOJI[st.s]} ${SEASON_CN[st.s]} · ${st.n?'夜晚':'白天'}`);
  if(st.s!==curSeason){
    trans={type:'season',t0:now,dur:3600,from:curSeason,to:st.s,
      nf0:nightFactor,nf1:st.n?1:0,swapped:false,e:0};
    Audio.windSwell(3.6);
  }else{
    trans={type:'night',t0:now,dur:1700,nf0:nightFactor,nf1:st.n?1:0};
  }
}
function stepTrans(now){
  if(!trans)return;
  const k=clamp((now-trans.t0)/trans.dur,0,1);
  if(trans.type==='night'){
    nightFactor=lerp(trans.nf0,trans.nf1,easeInOutCubic(k));
    if(k>=1)trans=null;
    return;
  }
  /* 换季：整体旋转一周 + 模型渐变 + 海报淡换 */
  const e=easeInOutCubic(k);
  trans.e=e;
  worldGroup.rotation.z=e*Math.PI*2;
  nightFactor=lerp(trans.nf0,trans.nf1,e);
  mixPalette(curSV,SEASON_VIS[trans.from],SEASON_VIS[trans.to],e);
  const pf=clamp(1-Math.abs(2*k-1),0,1);
  posters.forEach(p=>{p.mat.opacity=pf;});
  if(!trans.swapped&&k>=.5){
    trans.swapped=true;
    curSeason=trans.to;
    posters.forEach(p=>{p.mat.map=texPoster(trans.to);p.mat.needsUpdate=true;});
    resetInteractables();
  }
  if(k>=1){
    worldGroup.rotation.z=0;
    posters.forEach(p=>{p.mat.opacity=1;});
    trans=null;
  }
}

/* 键盘：任意键切换 */
window.addEventListener('keydown',e=>{
  if(e.key==='Tab')return;
  if(['Shift','Control','Alt','Meta'].includes(e.key))return;
  if(/^F\d+$/.test(e.key))return;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  gotoNext();
});
document.getElementById('switchBtn').addEventListener('click',e=>{
  gotoNext();e.currentTarget.blur();
});
document.getElementById('soundBtn').addEventListener('click',e=>{
  ensureAudio();
  const muted=Audio.toggleMute();
  e.currentTarget.textContent=muted?'🔇':'🔊';
  e.currentTarget.blur();
});

/* ============================================================
   §12 主循环
============================================================ */
let windAmp=1,lastT=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  const t=now/1000;
  stepTweens();
  stepTrans(now);
  /* 换季时风势加大 */
  const targetWind=(trans&&trans.type==='season')?2.3:1;
  windAmp+=(targetWind-windAmp)*.05;
  /* 昼夜光效插值（换季时新旧两季光照同时交叉淡化） */
  {
    let fromS=curSeason,toS=curSeason,le=1;
    if(trans&&trans.type==='season'){fromS=trans.from;toS=trans.to;le=trans.e;}
    mixPalette(tmpA,LIGHT[fromS].day,LIGHT[fromS].night,nightFactor);
    mixPalette(tmpB,LIGHT[toS].day,LIGHT[toS].night,nightFactor);
    mixPalette(curL,tmpA,tmpB,le);
  }
  applyVisuals();
  /* 微风：草与树冠摇曳 */
  for(const g of grassBlades){
    g.m.rotation.x=Math.sin(t*1.9+g.phase)*g.amp*windAmp;
    g.m.rotation.y=Math.sin(t*1.1+g.phase*2)*.02*windAmp;
  }
  crownGroup.rotation.x=Math.sin(t*.7)*.012*windAmp;
  crownGroup.rotation.y=Math.sin(t*.53+1)*.015*windAmp;
  /* 悬停检测 */
  if(mouseDirty&&!dragging&&!downPos){
    mouseDirty=false;
    const hit=(!trans)?pickAt(mouseXY.x,mouseXY.y):null;
    if(hit!==hoverRoot){
      hoverRoot=hit;
      canvas.classList.toggle('pick',!!hit);
    }
  }
  /* 落叶 / 花瓣 */
  [[leafFallSys,curSV.leafFall],[petalSys,curSV.petalFall]].forEach(([sys,inten])=>{
    if(!sys.group.visible)return;
    for(const it of sys.items){
      it.m.position.z-=it.vy*dt*(.6+inten*.6);
      it.m.position.x+=Math.sin(t*1.3+it.phase)*.4*dt*windAmp;
      it.m.position.y+=Math.cos(t*1.05+it.phase)*.32*dt*windAmp;
      it.m.rotation.x+=it.rs*dt;it.m.rotation.y+=it.rs*.7*dt;
      if(it.m.position.z<sys.killZ)sys.reset(it);
    }
  });
  /* 雪 */
  if(snowSys.mat.opacity>.02){
    const p=snowSys.pos;
    for(let i=0;i<snowSys.v.length;i++){
      let z=p.getZ(i)-snowSys.v[i]*dt;
      let x=p.getX(i)+Math.sin(t*.8+i)*.18*dt;
      if(z<GZ+.05){z=rand(3.8,4.8);x=rand(-10,16);p.setY(i,rand(-9,15));}
      p.setZ(i,z);p.setX(i,x);
    }
    p.needsUpdate=true;
  }
  /* 萤火虫 */
  if(curL.ff>.02){
    for(const f of fireflies){
      const u=f.userData;
      f.position.set(
        u.base.x+Math.sin(t*.6+u.phase)*u.amp,
        u.base.y+Math.cos(t*.45+u.phase*1.3)*u.amp,
        u.base.z+Math.sin(t*.8+u.phase*2)*.25);
      f.material.opacity=curL.ff*(.25+.75*Math.abs(Math.sin(t*2.1+u.phase)));
    }
  }
  /* 光柱尘埃 */
  if(dust.mat.opacity>.01){
    const p=dust.pos;
    dust.seed.forEach((s,i)=>{
      p.setXYZ(i,
        s.x+Math.sin(t*.5+s.p)*.06,
        s.y+Math.sin(t*.35+s.p*2)*.08,
        s.z+Math.sin(t*.25+s.p)*.05);
    });
    p.needsUpdate=true;
  }
  /* 窗帘轻摆 */
  const sway=Math.sin(t*1.4)*.02*windAmp;
  curtL.rotation.y=curtainOpen>.5?sway:0;
  curtR.rotation.y=curtainOpen>.5?-sway:0;
  updateCamera();
  renderer.render(scene,camera);
}

/* ============================================================
   §13 启动
============================================================ */
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
function ensureAudio(){
  if(!Audio.started){
    Audio.init();
    if(Audio.started){
      Audio.setSeason(curSeason);
      document.getElementById('soundBtn').textContent='🔊';
    }
  }else if(Audio.ctx&&Audio.ctx.state==='suspended')Audio.ctx.resume();
}
/* 调试/分享：?state=N 直达某状态，?open=1 自动开窗帘，?tidy=1 自动收拾 */
try{
  const q=new URLSearchParams(location.search);
  const si=parseInt(q.get('state'),10);
  if(si>=1&&si<STATES.length){
    stateIdx=si;
    const st=STATES[si];
    curSeason=st.s;nightFactor=st.n?1:0;
    mixPalette(curSV,SEASON_VIS[curSeason],SEASON_VIS[curSeason],0);
    posters.forEach(p=>{p.mat.map=texPoster(curSeason);p.mat.needsUpdate=true;});
    updateButton();
  }
  if(q.get('open')==='1')setTimeout(()=>setCurtain(1),900);
  if(q.get('tidy')==='1')setTimeout(()=>{
    setChair(CHAIR_STRAIGHT,true);
    posters.forEach(p=>p.holder.rotation.z=0);
    storeBook();pens.forEach(p=>collectPen(p));
  },900);
  if(q.get('noloader')==='1'){
    const L=document.getElementById('loader');L.classList.add('hide');L.style.display='none';
    ['titleblock','switchBtn','soundBtn','dots','hint'].forEach(id=>{
      const el=document.getElementById(id);el.classList.add('in','ready');
    });
  }
  const sw=parseInt(q.get('switch'),10);
  if(sw>0)setTimeout(()=>gotoNext(),sw);
}catch(e){}

/* 入场：镜头轻推 + UI 淡入 */
orbit.dist=16.5;orbit.tdist=16.5;
tween({dur:1600,ease:easeOutCubic,update:k=>{orbit.tdist=lerp(16.5,12.6,k);}});
animate();
setTimeout(()=>{
  document.getElementById('loader').classList.add('hide');
  document.getElementById('titleblock').classList.add('in');
  document.getElementById('switchBtn').classList.add('in');
  document.getElementById('soundBtn').classList.add('in');
  document.getElementById('dots').classList.add('in');
  document.getElementById('hint').classList.add('in');
  showToast('🌻 夏 · 白天 —— 点击任意处开启声音',2600);
},600);
setTimeout(()=>{
  document.getElementById('switchBtn').classList.add('ready');
  document.getElementById('soundBtn').classList.add('ready');
},2600);
})();
</script>
